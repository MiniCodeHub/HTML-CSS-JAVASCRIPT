<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Tracker - Episode 11</title>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Budget Dashboard</h1>
    </div>

    <!-- Statistics -->

    <div class="stats">

        <div class="stat">
            <p>Total Income</p>
            <h3 class="income" id="totalIncome">
                ₹0
            </h3>
        </div>

        <div class="stat">
            <p>Total Expense</p>
            <h3 class="expense" id="totalExpense">
                ₹0
            </h3>
        </div>

        <div class="stat">
            <p>Balance</p>
            <h3 class="balance" id="balance">
                ₹0
            </h3>
        </div>

    </div>

    <!-- Charts -->

    <div class="dashboard">

        <div class="card">

            <h2>Income vs Expense</h2>

            <canvas
                id="barChart"
                width="500"
                height="350">
            </canvas>

        </div>

        <div class="card">

            <h2>Expense by Category</h2>

            <canvas
                id="pieChart"
                width="500"
                height="350">
            </canvas>

        </div>

        <div class="card full">

            <h2>Category Expense Summary</h2>

            <div id="categorySummary"></div>

        </div>

    </div>

</div>

</body>
</html>


<style>
   * {
       margin: 0;
       padding: 0;
       box-sizing: border-box;
       font-family: Arial, sans-serif;
   }
   body {
       background: #0f172a;
       color: white;
       padding: 30px;
   }
   .container {
       max-width: 1100px;
       margin: auto;
   }
   .header {
       display: flex;
       justify-content: space-between;
       align-items: center;
       margin-bottom: 30px;
   }
   .header h1 {
       font-size: 32px;
   }
   .dashboard {
       display: grid;
       grid-template-columns: repeat(2, 1fr);
       gap: 20px;
   }
   .card {
       background: #1e293b;
       padding: 20px;
       border-radius: 15px;
   }
   .card h2 {
       margin-bottom: 20px;
       font-size: 20px;
   }
   .full {
       grid-column: 1 / -1;
   }
   canvas {
       width: 100%;
       max-width: 100%;
       background: #0f172a;
       border-radius: 10px;
   }
   .stats {
       display: grid;
       grid-template-columns: repeat(3, 1fr);
       gap: 15px;
       margin-bottom: 20px;
   }
   .stat {
       background: #1e293b;
       padding: 20px;
       border-radius: 12px;
   }
   .stat p {
       color: #94a3b8;
       margin-bottom: 8px;
   }
   .stat h3 {
       font-size: 25px;
   }
   .income {
       color: #22c55e;
   }
   .expense {
       color: #ef4444;
   }
   .balance {
       color: #38bdf8;
   }
   @media (max-width: 700px) {
       .dashboard {
           grid-template-columns: 1fr;
       }
       .stats {
           grid-template-columns: 1fr;
       }
       .full {
           grid-column: auto;
       }
   }
</style>

<script>

const transactions =
    JSON.parse(
        localStorage.getItem("transactions")
    ) || [];


/* =========================
   CALCULATE TOTALS
========================= */

function calculateTotals() {

    let income = 0;
    let expense = 0;

    transactions.forEach(transaction => {

        const amount =
            Number(transaction.amount);

        if (
            transaction.type === "Income" ||
            transaction.type === "income"
        ) {

            income += amount;

        } else {

            expense += amount;

        }

    });

    document.getElementById(
        "totalIncome"
    ).textContent =
        `₹${income.toLocaleString()}`;

    document.getElementById(
        "totalExpense"
    ).textContent =
        `₹${expense.toLocaleString()}`;

    document.getElementById(
        "balance"
    ).textContent =
        `₹${(income - expense).toLocaleString()}`;

    return {
        income,
        expense
    };
}


/* =========================
   CATEGORY DATA
========================= */

function getCategoryExpenses() {

    const categories = {};

    transactions.forEach(transaction => {

        const type =
            transaction.type ||
            transaction.transaction_type;

        if (
            type !== "Expense" &&
            type !== "expense"
        ) {
            return;
        }

        const category =
            transaction.category || "Other";

        const amount =
            Number(transaction.amount);

        if (!categories[category]) {
            categories[category] = 0;
        }

        categories[category] += amount;

    });

    return categories;
}


/* =========================
   BAR CHART
========================= */

function drawBarChart() {

    const canvas =
        document.getElementById("barChart");

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const totals =
        calculateTotals();

    const values = [
        totals.income,
        totals.expense
    ];

    const labels = [
        "Income",
        "Expense"
    ];

    const maxValue =
        Math.max(...values, 1);

    const chartHeight = 230;

    const barWidth = 100;

    const positions = [
        130,
        320
    ];

    values.forEach((value, index) => {

        const barHeight =
            (value / maxValue) *
            chartHeight;

        const x =
            positions[index];

        const y =
            280 - barHeight;

        ctx.fillStyle =
            index === 0
                ? "#22c55e"
                : "#ef4444";

        ctx.fillRect(
            x,
            y,
            barWidth,
            barHeight
        );

        ctx.fillStyle = "white";

        ctx.font = "16px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            `₹${value}`,
            x + barWidth / 2,
            y - 10
        );

        ctx.fillText(
            labels[index],
            x + barWidth / 2,
            310
        );

    });

}


/* =========================
   PIE CHART
========================= */

function drawPieChart() {

    const canvas =
        document.getElementById("pieChart");

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const categories =
        getCategoryExpenses();

    const values =
        Object.values(categories);

    const labels =
        Object.keys(categories);

    if (values.length === 0) {

        ctx.fillStyle = "#94a3b8";

        ctx.font = "18px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "No expense data",
            canvas.width / 2,
            canvas.height / 2
        );

        return;
    }

    const total =
        values.reduce(
            (sum, value) =>
                sum + value,
            0
        );

    const colors = [
        "#3b82f6",
        "#22c55e",
        "#f59e0b",
        "#ef4444",
        "#a855f7",
        "#06b6d4"
    ];

    let startAngle = 0;

    const centerX = 180;
    const centerY = 175;
    const radius = 110;

    values.forEach((value, index) => {

        const sliceAngle =
            (value / total) *
            Math.PI *
            2;

        ctx.beginPath();

        ctx.moveTo(
            centerX,
            centerY
        );

        ctx.arc(
            centerX,
            centerY,
            radius,
            startAngle,
            startAngle + sliceAngle
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[index % colors.length];

        ctx.fill();

        startAngle += sliceAngle;

    });


    /* Legend */

    labels.forEach((label, index) => {

        const y =
            50 + index * 40;

        ctx.fillStyle =
            colors[index % colors.length];

        ctx.fillRect(
            330,
            y - 12,
            15,
            15
        );

        ctx.fillStyle = "white";

        ctx.font = "14px Arial";

        ctx.textAlign = "left";

        ctx.fillText(
            `${label} ₹${categories[label]}`,
            355,
            y
        );

    });

}


/* =========================
   CATEGORY SUMMARY
========================= */

function renderCategorySummary() {

    const container =
        document.getElementById(
            "categorySummary"
        );

    const categories =
        getCategoryExpenses();

    container.innerHTML = "";

    if (
        Object.keys(categories).length === 0
    ) {

        container.innerHTML =
            "<p>No expenses recorded.</p>";

        return;
    }

    Object.entries(categories).forEach(
        ([category, amount]) => {

            const row =
                document.createElement("div");

            row.style.display = "flex";
            row.style.justifyContent =
                "space-between";

            row.style.padding = "12px 0";

            row.style.borderBottom =
                "1px solid #334155";

            row.innerHTML = `
                <span>${category}</span>
                <strong>₹${amount}</strong>
            `;

            container.appendChild(row);

        }
    );

}


/* =========================
   INITIALIZE DASHBOARD
========================= */

calculateTotals();

drawBarChart();

drawPieChart();

renderCategorySummary();

</script>
