<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Budget Tracker - Episode 13</title>

</head>


<body>

<div class="container">

    <h1>Budget Tracker</h1>


    <!-- =========================
         STATISTICS
    ========================== -->

    <div class="stats">

        <div class="stat">

            <p>Total Income</p>

            <h2
                id="totalIncome"
                class="income"
            >
                ₹0
            </h2>

        </div>


        <div class="stat">

            <p>Total Expense</p>

            <h2
                id="totalExpense"
                class="expense"
            >
                ₹0
            </h2>

        </div>


        <div class="stat">

            <p>Balance</p>

            <h2
                id="balance"
                class="balance"
            >
                ₹0
            </h2>

        </div>

    </div>


    <!-- =========================
         FILTERS
    ========================== -->

    <div class="card">

        <h2>Search & Filter</h2>

        <br>

        <div class="filters">

            <input
                id="searchInput"
                type="text"
                placeholder="Search title or category..."
                oninput="applyFilters()"
            >


            <select
                id="typeFilter"
                onchange="applyFilters()"
            >

                <option value="All">
                    All Types
                </option>

                <option value="Income">
                    Income
                </option>

                <option value="Expense">
                    Expense
                </option>

            </select>


            <select
                id="categoryFilter"
                onchange="applyFilters()"
            >

                <option value="All">
                    All Categories
                </option>

            </select>


            <select
                id="sortFilter"
                onchange="applyFilters()"
            >

                <option value="newest">
                    Newest First
                </option>

                <option value="oldest">
                    Oldest First
                </option>

                <option value="highest">
                    Highest Amount
                </option>

                <option value="lowest">
                    Lowest Amount
                </option>

                <option value="az">
                    Title A-Z
                </option>

                <option value="za">
                    Title Z-A
                </option>

            </select>

        </div>


        <button
            class="clear-btn"
            onclick="clearFilters()"
        >
            Clear Filters
        </button>

    </div>


    <!-- =========================
         TRANSACTIONS
    ========================== -->

    <div class="card">

        <h2>Transactions</h2>

        <br>

        <p
            id="resultCount"
            class="result-count"
        >
            0 transactions
        </p>


        <table>

            <thead>

                <tr>

                    <th>Title</th>

                    <th>Category</th>

                    <th>Type</th>

                    <th>Amount</th>

                    <th>Date</th>

                </tr>

            </thead>


            <tbody id="transactionList"></tbody>

        </table>

    </div>

</div>

</body>

</html>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    body {
        background: #0f172a;
        color: white;
        padding: 30px;
    }
    .container {
        max-width: 1100px;
        margin: auto;
    }
    h1 {
        margin-bottom: 25px;
    }
    .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
    }
    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 20px;
    }
    .stat {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
    }
    .stat p {
        color: #94a3b8;
        margin-bottom: 8px;
    }
    .stat h2 {
        font-size: 26px;
    }
    .income {
        color: #22c55e;
    }
    .expense {
        color: #ef4444;
    }
    .balance {
        color: #38bdf8;
    }
    .filters {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 12px;
    }
    input,
    select,
    button {
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-size: 15px;
    }
    input,
    select {
        background: #334155;
        color: white;
        outline: none;
    }
    input:focus,
    select:focus {
        box-shadow: 0 0 0 2px #3b82f6;
    }
    button {
        cursor: pointer;
        color: white;
    }
    .clear-btn {
        margin-top: 12px;
        background: #475569;
    }
    .clear-btn:hover {
        background: #64748b;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th,
    td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #334155;
    }
    th {
        color: #94a3b8;
    }
    .amount-income {
        color: #22c55e;
    }
    .amount-expense {
        color: #ef4444;
    }
    .empty {
        text-align: center;
        padding: 30px;
        color: #94a3b8;
    }
    .result-count {
        color: #94a3b8;
        margin-bottom: 15px;
    }
    @media (max-width: 800px) {
        .stats {
            grid-template-columns: 1fr;
        }
        .filters {
            grid-template-columns: 1fr;
        }
        table {
            display: block;
            overflow-x: auto;
        }
    }
</style>

<script>


/* =========================
   LOAD TRANSACTIONS
========================= */

let transactions =
    JSON.parse(
        localStorage.getItem("transactions")
    ) || [];


/* =========================
   FORMAT CURRENCY
========================= */

function formatCurrency(amount) {

    return `₹${Number(amount).toLocaleString(
        "en-IN"
    )}`;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(transaction) {

    if (transaction.date) {

        return transaction.date;

    }

    return "No date";

}


/* =========================
   CREATE CATEGORY FILTER
========================= */

function loadCategories() {

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );


    const categories =
        [
            ...new Set(
                transactions
                    .map(
                        transaction =>
                            transaction.category
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    categoryFilter.innerHTML = `
        <option value="All">
            All Categories
        </option>
    `;


    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;

        option.textContent = category;

        categoryFilter.appendChild(option);

    });

}


/* =========================
   APPLY FILTERS
========================= */

function applyFilters() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    const type =
        document
            .getElementById("typeFilter")
            .value;


    const category =
        document
            .getElementById("categoryFilter")
            .value;


    const sort =
        document
            .getElementById("sortFilter")
            .value;


    let filtered =
        transactions.filter(
            transaction => {

                const title =
                    String(
                        transaction.title || ""
                    ).toLowerCase();


                const transactionCategory =
                    String(
                        transaction.category || ""
                    ).toLowerCase();


                const matchesSearch =
                    title.includes(search) ||
                    transactionCategory.includes(search);


                const matchesType =
                    type === "All" ||
                    transaction.type === type;


                const matchesCategory =
                    category === "All" ||
                    transaction.category === category;


                return (
                    matchesSearch &&
                    matchesType &&
                    matchesCategory
                );

            }
        );


    /* =========================
       SORT
    ========================== */

    filtered.sort(
        (a, b) => {

            if (sort === "newest") {

                return (
                    Number(b.id || 0) -
                    Number(a.id || 0)
                );

            }


            if (sort === "oldest") {

                return (
                    Number(a.id || 0) -
                    Number(b.id || 0)
                );

            }


            if (sort === "highest") {

                return (
                    Number(b.amount) -
                    Number(a.amount)
                );

            }


            if (sort === "lowest") {

                return (
                    Number(a.amount) -
                    Number(b.amount)
                );

            }


            if (sort === "az") {

                return (
                    a.title || ""
                ).localeCompare(
                    b.title || ""
                );

            }


            if (sort === "za") {

                return (
                    b.title || ""
                ).localeCompare(
                    a.title || ""
                );

            }


            return 0;

        }
    );


    renderTransactions(filtered);

}


/* =========================
   RENDER TRANSACTIONS
========================= */

function renderTransactions(
    filteredTransactions
) {

    const list =
        document.getElementById(
            "transactionList"
        );


    const resultCount =
        document.getElementById(
            "resultCount"
        );


    list.innerHTML = "";


    resultCount.textContent =
        `${filteredTransactions.length} transaction${
            filteredTransactions.length !== 1
                ? "s"
                : ""
        } found`;


    if (
        filteredTransactions.length === 0
    ) {

        list.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >

                    No transactions match
                    your filters.

                </td>

            </tr>

        `;

        return;

    }


    filteredTransactions.forEach(
        transaction => {

            const row =
                document.createElement("tr");


            const isIncome =
                transaction.type ===
                "Income";


            row.innerHTML = `

                <td>
                    ${escapeHTML(
                        transaction.title
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        transaction.category
                    )}
                </td>

                <td>
                    ${transaction.type}
                </td>

                <td class="${
                    isIncome
                        ? "amount-income"
                        : "amount-expense"
                }">

                    ${
                        isIncome
                            ? "+"
                            : "-"
                    }

                    ${formatCurrency(
                        transaction.amount
                    )}

                </td>

                <td>
                    ${formatDate(transaction)}
                </td>

            `;


            list.appendChild(row);

        }
    );

}


/* =========================
   PREVENT HTML INJECTION
========================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================
   CALCULATE DASHBOARD
========================= */

function calculateStats() {

    let income = 0;

    let expense = 0;


    transactions.forEach(
        transaction => {

            if (
                transaction.type ===
                "Income"
            ) {

                income +=
                    Number(
                        transaction.amount
                    );

            } else {

                expense +=
                    Number(
                        transaction.amount
                    );

            }

        }
    );


    document
        .getElementById("totalIncome")
        .textContent =
        formatCurrency(income);


    document
        .getElementById("totalExpense")
        .textContent =
        formatCurrency(expense);


    document
        .getElementById("balance")
        .textContent =
        formatCurrency(
            income - expense
        );

}


/* =========================
   CLEAR FILTERS
========================= */

function clearFilters() {

    document
        .getElementById("searchInput")
        .value = "";


    document
        .getElementById("typeFilter")
        .value = "All";


    document
        .getElementById("categoryFilter")
        .value = "All";


    document
        .getElementById("sortFilter")
        .value = "newest";


    applyFilters();

}


/* =========================
   INITIALIZE
========================= */

loadCategories();

calculateStats();

applyFilters();


</script>
