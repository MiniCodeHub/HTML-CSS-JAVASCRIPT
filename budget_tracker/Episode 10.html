<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budget Tracker - Episode 10</title>

</head>

<body>

<div class="container">

<div class="header">

<h1>Budget Tracker</h1>

<button
class="theme-btn"
onclick="toggleTheme()"
id="themeButton">

🌙 Dark Mode

</button>

</div>

<div class="card">

<input
id="title"
placeholder="Transaction Title">

<input
id="amount"
type="number"
placeholder="Amount">

<select id="type">

<option value="Income">Income</option>
<option value="Expense">Expense</option>

</select>

<button
style="margin-top:15px;background:#16a34a;color:white;"
onclick="addTransaction()">

Add Transaction

</button>

</div>

<div class="card">

<table>

<thead>

<tr>

<th>Title</th>
<th>Type</th>
<th>Amount</th>

</tr>

</thead>

<tbody id="transactions"></tbody>

</table>

</div>

</div>
</body>
</html>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
transition:0.3s;
}

body{
background:#f1f5f9;
color:#111827;
padding:40px;
}

body.dark{
background:#0f172a;
color:white;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.theme-btn{
background:#2563eb;
color:white;
}

.card{
padding:20px;
border-radius:12px;
margin-top:20px;
background:white;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.dark .card{
background:#1e293b;
}

input,select{

width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #cbd5e1;

}

.dark input,
.dark select{

background:#334155;
border:none;
color:white;

}

table{

width:100%;
margin-top:25px;
border-collapse:collapse;

}

th,td{

padding:14px;
text-align:left;

}

th{

background:#2563eb;
color:white;

}

tbody tr:nth-child(even){

background:#f8fafc;

}

.dark tbody tr:nth-child(even){

background:#273549;

}

.dark tbody tr:nth-child(odd){

background:#1e293b;

}

.income{

color:#16a34a;
font-weight:bold;

}

.expense{

color:#dc2626;
font-weight:bold;

}

</style>


<script>

let transactions=
JSON.parse(
localStorage.getItem("transactions")
)||[];

const body=document.body;

const button=
document.getElementById("themeButton");

function loadTheme(){

const savedTheme=
localStorage.getItem("theme");

if(savedTheme==="dark"){

body.classList.add("dark");
button.innerHTML="☀️ Light Mode";

}

}

function toggleTheme(){

body.classList.toggle("dark");

const dark=
body.classList.contains("dark");

localStorage.setItem(
"theme",
dark?"dark":"light"
);

button.innerHTML=
dark?
"☀️ Light Mode":
"🌙 Dark Mode";

}

function save(){

localStorage.setItem(
"transactions",
JSON.stringify(transactions)
);

}

function addTransaction(){

const title=
document.getElementById("title").value;

const amount=
Number(
document.getElementById("amount").value
);

const type=
document.getElementById("type").value;

if(!title || amount<=0){

alert("Enter valid details");

return;

}

transactions.push({

title,
amount,
type

});

save();

render();

document.getElementById("title").value="";
document.getElementById("amount").value="";

}

function render(){

const tbody=
document.getElementById("transactions");

tbody.innerHTML="";

transactions.forEach(item=>{

tbody.innerHTML+=`

<tr>

<td>${item.title}</td>

<td class="${item.type.toLowerCase()}">
${item.type}
</td>

<td class="${item.type.toLowerCase()}">
$${item.amount}
</td>

</tr>

`;

});

}

loadTheme();
render();

</script>
