<!DOCTYPE html>
<html lang="en">
r
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Budget Tracker - Episode 14</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 20px;
        }

        .stat {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
        }

        .stat p {
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .stat h2 {
            font-size: 26px;
        }

        .income {
            color: #22c55e;
        }

        .expense {
            color: #ef4444;
        }

        .balance {
            color: #38bdf8;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr 1fr 1fr;

            gap: 12px;
        }

        .filters {
            display: grid;

            grid-template-columns:
                2fr 1fr 1fr 1fr;

            gap: 12px;
        }

        input,
        select,
        button {
            padding: 12px;

            border-radius: 8px;

            border: none;

            font-size: 15px;
        }

        input,
        select {
            background: #334155;

            color: white;

            outline: none;
        }

        input:focus,
        select:focus {
            box-shadow:
                0 0 0 2px #3b82f6;
        }

        button {
            cursor: pointer;

            color: white;
        }

        .primary-btn {
            background: #2563eb;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .clear-btn {
            margin-top: 12px;

            background: #475569;
        }

        .clear-btn:hover {
            background: #64748b;
        }

        .date-actions {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 12px;
        }

        .date-actions button {
            background: #334155;
        }

        .date-actions button:hover {
            background: #475569;
        }

        table {
            width: 100%;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;

            text-align: left;

            border-bottom:
                1px solid #334155;
        }

        th {
            color: #94a3b8;
        }

        .amount-income {
            color: #22c55e;
        }

        .amount-expense {
            color: #ef4444;
        }

        .result-count {
            color: #94a3b8;

            margin-bottom: 15px;
        }

        .empty {
            text-align: center;

            padding: 30px;

            color: #94a3b8;
        }

        .date-badge {
            display: inline-block;

            padding: 4px 8px;

            border-radius: 6px;

            background: #334155;

            font-size: 13px;
        }

        @media (max-width: 900px) {

            .stats,
            .form-grid,
            .filters {
                grid-template-columns: 1fr;
            }

            table {
                display: block;

                overflow-x: auto;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>Budget Tracker</h1>


    <!-- =========================
         STATISTICS
    ========================== -->

    <div class="stats">

        <div class="stat">

            <p>Total Income</p>

            <h2
                id="totalIncome"
                class="income"
            >
                ₹0
            </h2>

        </div>


        <div class="stat">

            <p>Total Expense</p>

            <h2
                id="totalExpense"
                class="expense"
            >
                ₹0
            </h2>

        </div>


        <div class="stat">

            <p>Balance</p>

            <h2
                id="balance"
                class="balance"
            >
                ₹0
            </h2>

        </div>

    </div>


    <!-- =========================
         ADD TRANSACTION
    ========================== -->

    <div class="card">

        <h2>Add Transaction</h2>

        <br>

        <div class="form-grid">

            <input
                id="titleInput"
                type="text"
                placeholder="Title"
            >


            <input
                id="categoryInput"
                type="text"
                placeholder="Category"
            >


            <input
                id="amountInput"
                type="number"
                min="0"
                step="0.01"
                placeholder="Amount"
            >


            <select id="typeInput">

                <option value="Expense">
                    Expense
                </option>

                <option value="Income">
                    Income
                </option>

            </select>

        </div>


        <br>


        <div class="form-grid">

            <input
                id="dateInput"
                type="date"
            >

            <button
                class="primary-btn"
                onclick="addTransaction()"
            >
                Add Transaction
            </button>

        </div>

    </div>


    <!-- =========================
         SEARCH & FILTER
    ========================== -->

    <div class="card">

        <h2>Search & Filter</h2>

        <br>

        <div class="filters">

            <input
                id="searchInput"
                type="text"
                placeholder="Search title or category..."
                oninput="applyFilters()"
            >


            <select
                id="typeFilter"
                onchange="applyFilters()"
            >

                <option value="All">
                    All Types
                </option>

                <option value="Income">
                    Income
                </option>

                <option value="Expense">
                    Expense
                </option>

            </select>


            <select
                id="categoryFilter"
                onchange="applyFilters()"
            >

                <option value="All">
                    All Categories
                </option>

            </select>


            <select
                id="sortFilter"
                onchange="applyFilters()"
            >

                <option value="newest">
                    Newest First
                </option>

                <option value="oldest">
                    Oldest First
                </option>

                <option value="highest">
                    Highest Amount
                </option>

                <option value="lowest">
                    Lowest Amount
                </option>

            </select>

        </div>


        <br>


        <!-- DATE FILTER -->

        <h3>Date Filter</h3>

        <br>

        <div class="filters">

            <input
                id="dateFilter"
                type="date"
                onchange="applyFilters()"
            >


            <input
                id="monthFilter"
                type="month"
                onchange="applyFilters()"
            >


            <select
                id="yearFilter"
                onchange="applyFilters()"
            >

                <option value="All">
                    All Years
                </option>

            </select>

        </div>


        <div class="date-actions">

            <button
                onclick="showToday()"
            >
                Today's Transactions
            </button>

            <button
                onclick="showCurrentMonth()"
            >
                This Month
            </button>

            <button
                onclick="clearDateFilters()"
            >
                Clear Date Filters
            </button>

        </div>


        <button
            class="clear-btn"
            onclick="clearAllFilters()"
        >
            Clear All Filters
        </button>

    </div>


    <!-- =========================
         TRANSACTIONS
    ========================== -->

    <div class="card">

        <h2>Transactions</h2>

        <br>

        <p
            id="resultCount"
            class="result-count"
        >
            0 transactions
        </p>


        <table>

            <thead>

                <tr>

                    <th>Title</th>

                    <th>Category</th>

                    <th>Type</th>

                    <th>Amount</th>

                    <th>Date</th>

                </tr>

            </thead>


            <tbody
                id="transactionList"
            ></tbody>

        </table>

    </div>

</div>


<script>


/* =========================
   LOAD TRANSACTIONS
========================= */

let transactions =
    JSON.parse(
        localStorage.getItem(
            "transactions"
        )
    ) || [];


/* =========================
   DEFAULT DATE
========================= */

document
    .getElementById("dateInput")
    .value =
    new Date()
        .toISOString()
        .split("T")[0];


/* =========================
   FORMAT CURRENCY
========================= */

function formatCurrency(amount) {

    return `₹${Number(amount)
        .toLocaleString("en-IN")}`;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(dateString) {

    if (!dateString) {

        return "No date";

    }


    const date =
        new Date(
            `${dateString}T00:00:00`
        );


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================
   ADD TRANSACTION
========================= */

function addTransaction() {

    const title =
        document
            .getElementById("titleInput")
            .value
            .trim();


    const category =
        document
            .getElementById("categoryInput")
            .value
            .trim();


    const amount =
        Number(
            document
                .getElementById("amountInput")
                .value
        );


    const type =
        document
            .getElementById("typeInput")
            .value;


    const date =
        document
            .getElementById("dateInput")
            .value;


    if (!title) {

        alert(
            "Please enter a title."
        );

        return;

    }


    if (!category) {

        alert(
            "Please enter a category."
        );

        return;

    }


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "Please enter a valid amount."
        );

        return;

    }


    if (!date) {

        alert(
            "Please select a date."
        );

        return;

    }


    const transaction = {

        id: Date.now(),

        title,

        category,

        amount,

        type,

        date

    };


    transactions.push(
        transaction
    );


    localStorage.setItem(
        "transactions",
        JSON.stringify(
            transactions
        )
    );


    document
        .getElementById("titleInput")
        .value = "";


    document
        .getElementById("categoryInput")
        .value = "";


    document
        .getElementById("amountInput")
        .value = "";


    loadCategories();

    loadYears();

    calculateStats();

    applyFilters();

}


/* =========================
   LOAD CATEGORIES
========================= */

function loadCategories() {

    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );


    const categories =
        [
            ...new Set(
                transactions
                    .map(
                        transaction =>
                            transaction.category
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    categoryFilter.innerHTML = `

        <option value="All">
            All Categories
        </option>

    `;


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                category;


            option.textContent =
                category;


            categoryFilter
                .appendChild(option);

        }
    );

}


/* =========================
   LOAD YEARS
========================= */

function loadYears() {

    const yearFilter =
        document.getElementById(
            "yearFilter"
        );


    const currentValue =
        yearFilter.value;


    const years =
        [
            ...new Set(
                transactions
                    .map(
                        transaction =>
                            transaction.date
                                ?.substring(0, 4)
                    )
                    .filter(Boolean)
            )
        ]
        .sort()
        .reverse();


    yearFilter.innerHTML = `

        <option value="All">
            All Years
        </option>

    `;


    years.forEach(
        year => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                year;


            option.textContent =
                year;


            yearFilter
                .appendChild(option);

        }
    );


    if (
        years.includes(currentValue)
    ) {

        yearFilter.value =
            currentValue;

    }

}


/* =========================
   APPLY FILTERS
========================= */

function applyFilters() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const type =
        document
            .getElementById(
                "typeFilter"
            )
            .value;


    const category =
        document
            .getElementById(
                "categoryFilter"
            )
            .value;


    const sort =
        document
            .getElementById(
                "sortFilter"
            )
            .value;


    const exactDate =
        document
            .getElementById(
                "dateFilter"
            )
            .value;


    const month =
        document
            .getElementById(
                "monthFilter"
            )
            .value;


    const year =
        document
            .getElementById(
                "yearFilter"
            )
            .value;


    let filtered =
        transactions.filter(
            transaction => {

                const title =
                    String(
                        transaction.title || ""
                    ).toLowerCase();


                const transactionCategory =
                    String(
                        transaction.category || ""
                    ).toLowerCase();


                const matchesSearch =
                    title.includes(search) ||
                    transactionCategory
                        .includes(search);


                const matchesType =
                    type === "All" ||
                    transaction.type === type;


                const matchesCategory =
                    category === "All" ||
                    transaction.category ===
                        category;


                const matchesDate =
                    !exactDate ||
                    transaction.date ===
                        exactDate;


                const matchesMonth =
                    !month ||
                    transaction.date
                        ?.startsWith(month);


                const matchesYear =
                    year === "All" ||
                    transaction.date
                        ?.startsWith(year);


                return (
                    matchesSearch &&
                    matchesType &&
                    matchesCategory &&
                    matchesDate &&
                    matchesMonth &&
                    matchesYear
                );

            }
        );


    /* =========================
       SORT
    ========================== */

    filtered.sort(
        (a, b) => {

            if (sort === "newest") {

                return (
                    (b.date || "")
                        .localeCompare(
                            a.date || ""
                        )
                );

            }


            if (sort === "oldest") {

                return (
                    (a.date || "")
                        .localeCompare(
                            b.date || ""
                        )
                );

            }


            if (sort === "highest") {

                return (
                    Number(b.amount) -
                    Number(a.amount)
                );

            }


            if (sort === "lowest") {

                return (
                    Number(a.amount) -
                    Number(b.amount)
                );

            }


            return 0;

        }
    );


    renderTransactions(
        filtered
    );

}


/* =========================
   RENDER TRANSACTIONS
========================= */

function renderTransactions(
    filteredTransactions
) {

    const list =
        document.getElementById(
            "transactionList"
        );


    const resultCount =
        document.getElementById(
            "resultCount"
        );


    list.innerHTML = "";


    resultCount.textContent =
        `${filteredTransactions.length} transaction${
            filteredTransactions.length !== 1
                ? "s"
                : ""
        } found`;


    if (
        filteredTransactions.length === 0
    ) {

        list.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >

                    No transactions match
                    your filters.

                </td>

            </tr>

        `;

        return;

    }


    filteredTransactions.forEach(
        transaction => {

            const row =
                document.createElement(
                    "tr"
                );


            const isIncome =
                transaction.type ===
                "Income";


            row.innerHTML = `

                <td>
                    ${escapeHTML(
                        transaction.title
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        transaction.category
                    )}
                </td>

                <td>
                    ${transaction.type}
                </td>

                <td class="${
                    isIncome
                        ? "amount-income"
                        : "amount-expense"
                }">

                    ${
                        isIncome
                            ? "+"
                            : "-"
                    }

                    ${formatCurrency(
                        transaction.amount
                    )}

                </td>

                <td>

                    <span
                        class="date-badge"
                    >
                        ${formatDate(
                            transaction.date
                        )}
                    </span>

                </td>

            `;


            list.appendChild(row);

        }
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =========================
   TODAY
========================= */

function showToday() {

    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    document
        .getElementById(
            "dateFilter"
        )
        .value = today;


    document
        .getElementById(
            "monthFilter"
        )
        .value = "";


    document
        .getElementById(
            "yearFilter"
        )
        .value = "All";


    applyFilters();

}


/* =========================
   CURRENT MONTH
========================= */

function showCurrentMonth() {

    const now =
        new Date();


    const month =
        now
            .toISOString()
            .substring(0, 7);


    document
        .getElementById(
            "dateFilter"
        )
        .value = "";


    document
        .getElementById(
            "monthFilter"
        )
        .value = month;


    document
        .getElementById(
            "yearFilter"
        )
        .value = "All";


    applyFilters();

}


/* =========================
   CLEAR DATE FILTERS
========================= */

function clearDateFilters() {

    document
        .getElementById(
            "dateFilter"
        )
        .value = "";


    document
        .getElementById(
            "monthFilter"
        )
        .value = "";


    document
        .getElementById(
            "yearFilter"
        )
        .value = "All";


    applyFilters();

}


/* =========================
   CLEAR ALL FILTERS
========================= */

function clearAllFilters() {

    document
        .getElementById(
            "searchInput"
        )
        .value = "";


    document
        .getElementById(
            "typeFilter"
        )
        .value = "All";


    document
        .getElementById(
            "categoryFilter"
        )
        .value = "All";


    document
        .getElementById(
            "sortFilter"
        )
        .value = "newest";


    clearDateFilters();

}


/* =========================
   CALCULATE STATS
========================= */

function calculateStats() {

    let income = 0;

    let expense = 0;


    transactions.forEach(
        transaction => {

            if (
                transaction.type ===
                "Income"
            ) {

                income += Number(
                    transaction.amount
                );

            } else {

                expense += Number(
                    transaction.amount
                );

            }

        }
    );


    document
        .getElementById(
            "totalIncome"
        )
        .textContent =
        formatCurrency(
            income
        );


    document
        .getElementById(
            "totalExpense"
        )
        .textContent =
        formatCurrency(
            expense
        );


    document
        .getElementById(
            "balance"
        )
        .textContent =
        formatCurrency(
            income - expense
        );

}


/* =========================
   INITIALIZE
========================= */

loadCategories();

loadYears();

calculateStats();

applyFilters();

</script>

</body>

</html>
