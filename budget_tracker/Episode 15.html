<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Budget Tracker Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        
            background: #f5f7fb;
        
            color: #1f2937;
        }


        .app {
            display: flex;
        
            min-height: 100vh;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 240px;
        
            background: #111827;
        
            color: white;
        
            padding: 25px 15px;
        
            position: fixed;
        
            top: 0;
            bottom: 0;
            left: 0;
        }


        .logo {
            font-size: 20px;
        
            font-weight: bold;
        
            padding: 10px 15px;
        
            margin-bottom: 30px;
        }


        nav {
            display: flex;
        
            flex-direction: column;
        
            gap: 8px;
        }


        .nav-item {
            border: none;
        
            background: transparent;
        
            color: #9ca3af;
        
            text-align: left;
        
            padding: 13px 15px;
        
            border-radius: 8px;
        
            cursor: pointer;
        
            font-size: 15px;
        
            transition: 0.2s;
        }


        .nav-item:hover,
        .nav-item.active {
            background: #1f2937;
        
            color: white;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 240px;
        
            width: calc(100% - 240px);
        
            padding: 35px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
        
            justify-content: space-between;
        
            align-items: center;
        
            margin-bottom: 30px;
        }


        .header h1 {
            font-size: 30px;
        
            margin-bottom: 6px;
        }


        .header p {
            color: #6b7280;
        }


        .month-selector {
            display: flex;
        
            flex-direction: column;
        
            gap: 6px;
        }


        .month-selector label {
            font-size: 13px;
        
            color: #6b7280;
        }


        .month-selector input {
            border: 1px solid #d1d5db;
        
            background: white;
        
            border-radius: 8px;
        
            padding: 10px 12px;
        
            font-size: 14px;
        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .summary-grid {
            display: grid;
        
            grid-template-columns:
                repeat(4, 1fr);
        
            gap: 20px;
        
            margin-bottom: 25px;
        }


        .summary-card {
            background: white;
        
            border-radius: 14px;
        
            padding: 22px;
        
            display: flex;
        
            align-items: center;
        
            gap: 15px;
        
            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.05);
        }


        .card-icon {
            width: 48px;
        
            height: 48px;
        
            border-radius: 12px;
        
            display: flex;
        
            align-items: center;
        
            justify-content: center;
        
            font-size: 22px;
        
            background: #f3f4f6;
        }


        .summary-card p {
            font-size: 13px;
        
            color: #6b7280;
        
            margin-bottom: 5px;
        }


        .summary-card h2 {
            font-size: 23px;
        }


        .income h2 {
            color: #16a34a;
        }


        .expense h2 {
            color: #dc2626;
        }


        .balance h2 {
            color: #2563eb;
        }


        .savings h2 {
            color: #7c3aed;
        }


        /* =========================
           DASHBOARD GRID
        ========================= */

        .dashboard-grid {
            display: grid;
        
            grid-template-columns:
                1fr 1fr;
        
            gap: 20px;
        
            margin-bottom: 25px;
        }


        .panel {
            background: white;
        
            border-radius: 14px;
        
            padding: 24px;
        
            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.05);
        }


        .panel-header {
            display: flex;
        
            justify-content: space-between;
        
            align-items: center;
        
            margin-bottom: 25px;
        }


        .panel-header h2 {
            font-size: 18px;
        
            margin-bottom: 5px;
        }


        .panel-header p {
            font-size: 13px;
        
            color: #6b7280;
        }


        /* =========================
           CATEGORY LIST
        ========================= */

        .category-list {
            display: flex;
        
            flex-direction: column;
        
            gap: 18px;
        }


        .category-item {
            display: flex;
        
            flex-direction: column;
        
            gap: 8px;
        }


        .category-info {
            display: flex;
        
            justify-content: space-between;
        
            font-size: 14px;
        }


        .category-name {
            font-weight: 600;
        }


        .category-amount {
            color: #6b7280;
        }


        .progress {
            height: 8px;
        
            background: #e5e7eb;
        
            border-radius: 20px;
        
            overflow: hidden;
        }


        .progress-bar {
            height: 100%;
        
            background: #2563eb;
        
            border-radius: 20px;
        
            transition: width 0.4s ease;
        }


        /* =========================
           MONTHLY CHART
        ========================= */

        .monthly-chart {
            height: 250px;
        
            display: flex;
        
            align-items: flex-end;
        
            justify-content: center;
        
            gap: 70px;
        
            padding-bottom: 35px;
        }


        .bar-group {
            height: 220px;
        
            display: flex;
        
            flex-direction: column;
        
            justify-content: flex-end;
        
            align-items: center;
        
            gap: 10px;
        }


        .bar {
            width: 65px;
        
            min-height: 5px;
        
            border-radius:
                8px 8px 0 0;
        
            transition:
                height 0.5s ease;
        }


        .income-bar {
            background: #16a34a;
        }


        .expense-bar {
            background: #dc2626;
        }


        .bar-group span {
            font-size: 13px;
        
            color: #6b7280;
        }


        /* =========================
           TRANSACTIONS
        ========================= */

        .transactions-panel {
            margin-bottom: 30px;
        }


        .transaction-list {
            display: flex;
        
            flex-direction: column;
        }


        .transaction {
            display: flex;
        
            justify-content: space-between;
        
            align-items: center;
        
            padding: 15px 0;
        
            border-bottom:
                1px solid #f0f0f0;
        }


        .transaction:last-child {
            border-bottom: none;
        }


        .transaction-left {
            display: flex;
        
            align-items: center;
        
            gap: 14px;
        }


        .transaction-icon {
            width: 42px;
        
            height: 42px;
        
            border-radius: 10px;
        
            background: #f3f4f6;
        
            display: flex;
        
            align-items: center;
        
            justify-content: center;
        }


        .transaction-title {
            font-weight: 600;
        
            font-size: 14px;
        }


        .transaction-category {
            color: #9ca3af;
        
            font-size: 12px;
        
            margin-top: 3px;
        }


        .transaction-amount {
            font-weight: bold;
        }


        .income-amount {
            color: #16a34a;
        }


        .expense-amount {
            color: #dc2626;
        }


        .transaction-count {
            background: #eef2ff;
        
            color: #4f46e5;
        
            padding: 6px 10px;
        
            border-radius: 20px;
        
            font-size: 12px;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty {
            text-align: center;
        
            padding: 30px;
        
            color: #9ca3af;
        
            font-size: 14px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {
        
            .summary-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        
        }


        @media (max-width: 800px) {
        
            .sidebar {
                width: 70px;
            
                padding: 20px 8px;
            }
        
        
            .logo {
                font-size: 0;
            
                text-align: center;
            }
        
        
            .logo::after {
                content: "💰";
            
                font-size: 22px;
            }
        
        
            .nav-item {
                font-size: 0;
            
                text-align: center;
            }
        
        
            .nav-item::first-letter {
                font-size: 18px;
            }
        
        
            .main {
                margin-left: 70px;
            
                width: calc(100% - 70px);
            
                padding: 20px;
            }
        
        
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        
        
            .header {
                flex-direction: column;
            
                align-items: flex-start;
            
                gap: 15px;
            }
        
        }


        @media (max-width: 550px) {
        
            .summary-grid {
                grid-template-columns: 1fr;
            }
        
        
            .main {
                padding: 15px;
            }
        
        
            .monthly-chart {
                gap: 40px;
            }
        
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">
                💰 Budget Tracker
            </div>

            <nav>

                <button class="nav-item active">
                    📊 Dashboard
                </button>

                <button class="nav-item">
                    💳 Transactions
                </button>

                <button class="nav-item">
                    🎯 Budgets
                </button>

                <button class="nav-item">
                    📈 Reports
                </button>

            </nav>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="main">

            <!-- HEADER -->

            <header class="header">

                <div>

                    <h1>Dashboard</h1>

                    <p>
                        Track your monthly finances
                    </p>

                </div>


                <div class="month-selector">

                    <label for="month">
                        Month
                    </label>

                    <input
                        type="month"
                        id="month"
                    >

                </div>

            </header>


            <!-- SUMMARY CARDS -->

            <section class="summary-grid">

                <div class="summary-card income">

                    <div class="card-icon">
                        💰
                    </div>

                    <div>

                        <p>Total Income</p>

                        <h2 id="totalIncome">
                            ₹0
                        </h2>

                    </div>

                </div>


                <div class="summary-card expense">

                    <div class="card-icon">
                        💸
                    </div>

                    <div>

                        <p>Total Expenses</p>

                        <h2 id="totalExpense">
                            ₹0
                        </h2>

                    </div>

                </div>


                <div class="summary-card balance">

                    <div class="card-icon">
                        💵
                    </div>

                    <div>

                        <p>Balance</p>

                        <h2 id="balance">
                            ₹0
                        </h2>

                    </div>

                </div>


                <div class="summary-card savings">

                    <div class="card-icon">
                        🎯
                    </div>

                    <div>

                        <p>Savings Rate</p>

                        <h2 id="savingsRate">
                            0%
                        </h2>

                    </div>

                </div>

            </section>


            <!-- DASHBOARD GRID -->

            <section class="dashboard-grid">

                <!-- SPENDING -->

                <div class="panel">

                    <div class="panel-header">

                        <div>

                            <h2>
                                Spending Overview
                            </h2>

                            <p>
                                Where your money is going
                            </p>

                        </div>

                    </div>


                    <div
                        id="categoryList"
                        class="category-list"
                    >
                    </div>

                </div>


                <!-- MONTHLY SUMMARY -->

                <div class="panel">

                    <div class="panel-header">

                        <div>

                            <h2>
                                Monthly Summary
                            </h2>

                            <p>
                                Income vs expenses
                            </p>

                        </div>

                    </div>


                    <div class="monthly-chart">

                        <div class="bar-group">

                            <div
                                class="bar income-bar"
                                id="incomeBar"
                            >
                            </div>

                            <span>
                                Income
                            </span>

                        </div>


                        <div class="bar-group">

                            <div
                                class="bar expense-bar"
                                id="expenseBar"
                            >
                            </div>

                            <span>
                                Expenses
                            </span>

                        </div>

                    </div>

                </div>

            </section>


            <!-- TRANSACTIONS -->

            <section class="panel transactions-panel">

                <div class="panel-header">

                    <div>

                        <h2>
                            Recent Transactions
                        </h2>

                        <p>
                            Transactions for selected month
                        </p>

                    </div>

                    <span
                        id="transactionCount"
                        class="transaction-count"
                    >
                        0
                    </span>

                </div>


                <div
                    id="transactionList"
                    class="transaction-list"
                >
                </div>

            </section>

        </main>

    </div>


    <script>
                // =========================
        // TRANSACTION DATA
        // =========================

        const transactions = [

            {
                id: 1,
                title: "Monthly Salary",
                category: "Salary",
                amount: 50000,
                type: "income",
                date: "2026-08-01"
            },

            {
                id: 2,
                title: "Rent",
                category: "Housing",
                amount: 12000,
                type: "expense",
                date: "2026-08-02"
            },

            {
                id: 3,
                title: "Groceries",
                category: "Food",
                amount: 4500,
                type: "expense",
                date: "2026-08-04"
            },

            {
                id: 4,
                title: "Metro Pass",
                category: "Transport",
                amount: 1500,
                type: "expense",
                date: "2026-08-05"
            },

            {
                id: 5,
                title: "Freelance Project",
                category: "Freelance",
                amount: 8000,
                type: "income",
                date: "2026-08-08"
            },

            {
                id: 6,
                title: "Restaurant",
                category: "Food",
                amount: 1800,
                type: "expense",
                date: "2026-08-10"
            },

            {
                id: 7,
                title: "Electricity Bill",
                category: "Utilities",
                amount: 2200,
                type: "expense",
                date: "2026-08-12"
            },

            {
                id: 8,
                title: "New Shoes",
                category: "Shopping",
                amount: 3500,
                type: "expense",
                date: "2026-08-15"
            },

            {
                id: 9,
                title: "Movie",
                category: "Entertainment",
                amount: 600,
                type: "expense",
                date: "2026-08-18"
            },

            {
                id: 10,
                title: "Internet Bill",
                category: "Utilities",
                amount: 999,
                type: "expense",
                date: "2026-08-20"
            }

        ];


        // =========================
        // DOM ELEMENTS
        // =========================

        const monthInput =
            document.getElementById("month");

        const totalIncome =
            document.getElementById("totalIncome");

        const totalExpense =
            document.getElementById("totalExpense");

        const balance =
            document.getElementById("balance");

        const savingsRate =
            document.getElementById("savingsRate");

        const categoryList =
            document.getElementById("categoryList");

        const transactionList =
            document.getElementById("transactionList");

        const transactionCount =
            document.getElementById("transactionCount");

        const incomeBar =
            document.getElementById("incomeBar");

        const expenseBar =
            document.getElementById("expenseBar");


        // =========================
        // DEFAULT MONTH
        // =========================

        const today =
            new Date();

        const defaultMonth =
            today.toISOString()
                .slice(0, 7);

        monthInput.value =
            "2026-08";


        // =========================
        // FORMAT CURRENCY
        // =========================

        function formatCurrency(amount) {

            return new Intl.NumberFormat(
                "en-IN",
                {
                    style: "currency",
                    currency: "INR",
                    maximumFractionDigits: 0
                }
            ).format(amount);

        }


        // =========================
        // FILTER TRANSACTIONS
        // =========================

        function getSelectedTransactions() {

            const selectedMonth =
                monthInput.value;


            return transactions.filter(
                transaction => {

                    return transaction.date
                        .startsWith(
                            selectedMonth
                        );

                }
            );

        }


        // =========================
        // CALCULATE TOTALS
        // =========================

        function calculateTotals(
            filteredTransactions
        ) {

            let income = 0;

            let expense = 0;


            filteredTransactions.forEach(
                transaction => {

                    if (
                        transaction.type ===
                        "income"
                    ) {

                        income +=
                            transaction.amount;

                    }


                    if (
                        transaction.type ===
                        "expense"
                    ) {

                        expense +=
                            transaction.amount;

                    }

                }
            );


            return {
                income,
                expense,
                balance:
                    income - expense
            };

        }


        // =========================
        // UPDATE SUMMARY
        // =========================

        function updateSummary(
            filteredTransactions
        ) {

            const totals =
                calculateTotals(
                    filteredTransactions
                );


            totalIncome.textContent =
                formatCurrency(
                    totals.income
                );


            totalExpense.textContent =
                formatCurrency(
                    totals.expense
                );


            balance.textContent =
                formatCurrency(
                    totals.balance
                );


            let rate = 0;


            if (totals.income > 0) {

                rate =
                    (
                        totals.balance /
                        totals.income
                    ) * 100;

            }


            savingsRate.textContent =
                `${rate.toFixed(1)}%`;

        }


        // =========================
        // CATEGORY ANALYSIS
        // =========================

        function updateCategories(
            filteredTransactions
        ) {

            categoryList.innerHTML = "";


            const expenses =
                filteredTransactions.filter(
                    transaction =>
                        transaction.type ===
                        "expense"
                );


            if (expenses.length === 0) {

                categoryList.innerHTML = `
                    <div class="empty">
                        No expenses found.
                    </div>
                `;

                return;
            }


            const categories = {};


            expenses.forEach(
                transaction => {

                    const category =
                        transaction.category;


                    if (!categories[category]) {

                        categories[category] = 0;

                    }


                    categories[category] +=
                        transaction.amount;

                }
            );


            const sortedCategories =
                Object.entries(
                    categories
                ).sort(
                    (a, b) =>
                        b[1] - a[1]
                );


            const totalExpenseAmount =
                expenses.reduce(
                    (total, transaction) =>
                        total +
                        transaction.amount,
                    0
                );


            sortedCategories.forEach(
                ([category, amount]) => {

                    const percentage =
                        (
                            amount /
                            totalExpenseAmount
                        ) * 100;


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "category-item";


                    item.innerHTML = `

                        <div class="category-info">

                            <span class="category-name">
                                ${category}
                            </span>

                            <span class="category-amount">
                                ${formatCurrency(amount)}
                            </span>

                        </div>

                        <div class="progress">

                            <div
                                class="progress-bar"
                                style="width: ${percentage}%"
                            >
                            </div>

                        </div>

                    `;


                    categoryList.appendChild(
                        item
                    );

                }
            );

        }


        // =========================
        // UPDATE CHART
        // =========================

        function updateChart(
            filteredTransactions
        ) {

            const totals =
                calculateTotals(
                    filteredTransactions
                );


            const maximum =
                Math.max(
                    totals.income,
                    totals.expense,
                    1
                );


            const incomeHeight =
                (
                    totals.income /
                    maximum
                ) * 180;


            const expenseHeight =
                (
                    totals.expense /
                    maximum
                ) * 180;


            incomeBar.style.height =
                `${Math.max(
                    incomeHeight,
                    5
                )}px`;


            expenseBar.style.height =
                `${Math.max(
                    expenseHeight,
                    5
                )}px`;

        }


        // =========================
        // TRANSACTIONS
        // =========================

        function updateTransactions(
            filteredTransactions
        ) {

            transactionList.innerHTML = "";


            transactionCount.textContent =
                filteredTransactions.length;


            if (
                filteredTransactions.length ===
                0
            ) {

                transactionList.innerHTML = `
                    <div class="empty">
                        No transactions found
                        for this month.
                    </div>
                `;

                return;
            }


            const sortedTransactions =
                [...filteredTransactions]
                    .sort(
                        (a, b) =>
                            new Date(b.date) -
                            new Date(a.date)
                    );


            sortedTransactions.forEach(
                transaction => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "transaction";


                    const sign =
                        transaction.type ===
                        "income"
                            ? "+"
                            : "-";


                    const amountClass =
                        transaction.type ===
                        "income"
                            ? "income-amount"
                            : "expense-amount";


                    const icon =
                        transaction.type ===
                        "income"
                            ? "💰"
                            : "💸";


                    item.innerHTML = `

                        <div class="transaction-left">

                            <div class="transaction-icon">
                                ${icon}
                            </div>

                            <div>

                                <div class="transaction-title">
                                    ${transaction.title}
                                </div>

                                <div class="transaction-category">
                                    ${transaction.category}
                                    •
                                    ${transaction.date}
                                </div>

                            </div>

                        </div>


                        <div
                            class="transaction-amount ${amountClass}"
                        >
                            ${sign}${formatCurrency(
                                transaction.amount
                            )}
                        </div>

                    `;


                    transactionList.appendChild(
                        item
                    );

                }
            );

        }


        // =========================
        // UPDATE DASHBOARD
        // =========================

        function updateDashboard() {

            const filteredTransactions =
                getSelectedTransactions();


            updateSummary(
                filteredTransactions
            );


            updateCategories(
                filteredTransactions
            );


            updateChart(
                filteredTransactions
            );


            updateTransactions(
                filteredTransactions
            );

        }


        // =========================
        // MONTH CHANGE
        // =========================

        monthInput.addEventListener(
            "change",
            updateDashboard
        );


        // =========================
        // INITIAL LOAD
        // =========================

        updateDashboard();
    </script>

</body>
</html>
