<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Tracker - Episode 8</title>
</head>

<body>

<div class="container">

<h1>Budget Tracker</h1>

<div class="controls">

<input
id="search"
placeholder="Search transaction..."
oninput="render()"
/>

<select id="filter" onchange="render()">
<option value="all">All</option>
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<select id="sort" onchange="render()">
<option value="latest">Latest</option>
<option value="high">Highest Amount</option>
<option value="low">Lowest Amount</option>
</select>

<button onclick="addTransaction()">
Add
</button>

</div>

<table>

<thead>

<tr>
<th>Title</th>
<th>Type</th>
<th>Amount</th>
</tr>

</thead>

<tbody id="body"></tbody>

</table>

</div>

</body>
</html>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
    padding:40px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:25px;
}

input,select{
    padding:10px;
    border:none;
    border-radius:8px;
    background:#1e293b;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
}

th,td{
    padding:14px;
    text-align:left;
}

th{
    background:#334155;
}

tr:nth-child(even){
    background:#273549;
}

.income{
    color:#22c55e;
}

.expense{
    color:#ef4444;
}

button{
    background:#3b82f6;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}
</style>


<script>

let transactions =
JSON.parse(localStorage.getItem("budget")) || [];

function save(){

localStorage.setItem(
"budget",
JSON.stringify(transactions)
);

}

function addTransaction(){

const title = prompt("Title");
if(!title) return;

const type = prompt("income / expense");

const amount =
Number(prompt("Amount"));

transactions.push({
title,
type,
amount,
date:Date.now()
});

save();

render();

}

function render(){

let data=[...transactions];

const search =
document
.getElementById("search")
.value
.toLowerCase();

const filter =
document
.getElementById("filter")
.value;

const sort =
document
.getElementById("sort")
.value;

data=data.filter(item=>{

const searchMatch =
item.title
.toLowerCase()
.includes(search);

const filterMatch =
filter==="all" ||
item.type===filter;

return searchMatch && filterMatch;

});

if(sort==="high"){

data.sort(
(a,b)=>b.amount-a.amount
);

}

else if(sort==="low"){

data.sort(
(a,b)=>a.amount-b.amount
);

}

else{

data.sort(
(a,b)=>b.date-a.date
);

}

const body =
document.getElementById("body");

body.innerHTML="";

data.forEach(item=>{

body.innerHTML+=`

<tr>

<td>${item.title}</td>

<td class="${item.type}">
${item.type}
</td>

<td class="${item.type}">
${item.type==="income"?"+":"-"}$${item.amount}
</td>

</tr>

`;

});

}

render();

</script>
